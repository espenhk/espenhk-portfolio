# Build + tests on every PR and on every push to main.
# Lovable commits straight to main without running tests, so this is the guard that catches
# colour literals, hand-edited design tokens and broken contrast (src/test/design-tokens.test.ts, src/test/test_starfleet_tokens.py).
name: CI

# Skip runs when only files that can't affect the build or tests changed (docs, plans, skills,
# Python helper scripts, DB migrations). An ignore-list rather than an allow-list, so a new kind
# of source file is checked by default instead of silently skipped.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.claude/**'
      - '.lovable/**'
      - 'scripts/*.py'
      - 'pyproject.toml'
      - 'poetry.lock'
      - 'supabase/**'
      - 'drizzle/migrations/**'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.claude/**'
      - '.lovable/**'
      - 'scripts/*.py'
      - 'pyproject.toml'
      - 'poetry.lock'
      - 'supabase/**'
      - 'drizzle/migrations/**'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Cache bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      # bun.lock points at Lovable's private npm cache; the script installs from npmjs instead
      # (integrity-checked) and leaves bun.lock untouched.
      - name: Install dependencies
        run: ./scripts/install-deps.sh

      # design-sync drift test (standard-library Python): tokens.json is the verbatim design-system
      # copy, tokens.css matches what the generator makes from it, and every contrast pair passes.
      - name: Design tokens match the design system (drift + contrast)
        run: bun run tokens:test

      - name: Build
        run: bun run build

      - name: Tests
        run: bunx vitest run
